project:
  type: website
  output-dir: docs
  # The post-render script must be indented here, under 'project'
  post-render:
    - bash -c 'cp docs/*md README.md 2>/dev/null || true' # Copies any generated markdown to README, or nothing. 
  render:
    - "!local_packages/"
    - "!hanpolnet_temp/"
    - MS_Succisa_deposition.qmd
    - MS_FML.qmd
    - Supplementary_Material.qmd

format:
  html:
    theme: cosmo
    toc: true
    self-contained: true
  gfm:
    preview-mode: webtex

